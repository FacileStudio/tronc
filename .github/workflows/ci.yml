name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The root module, on the oldest Go the suite still runs. Pinning 1.24 here is
  # what keeps the documented floor honest: build it only on a newer toolchain
  # and a 1.25-only construct lands in the chassis without anyone noticing.
  # gofmt is a plain file walk, so this step covers the nested modules too.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  # The nested modules. `./...` above never reaches them, and they do not share
  # a Go floor: migrate needs 1.25 because goose declares go 1.25.7, while
  # testdb stays on 1.24 with the root.
  check-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: migrate
            go: "1.25"
          - module: testdb
            go: "1.24"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --config ../.golangci.yml
